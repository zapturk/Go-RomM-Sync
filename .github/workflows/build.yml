name: Build

on:
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: "linux/amd64"
            tags: ""
          - os: windows-latest
            platform: "windows/amd64"
            tags: ""
          - os: macos-latest
            platform: "darwin/universal"
            tags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        shell: bash
        run: |
          for i in 1 2 3; do
            go install -tags purego github.com/wailsapp/wails/v3/cmd/wails3@latest && break || sleep 3
          done

      - name: Build frontend
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          wails3 generate bindings -f '-tags purego' -ts
          cd frontend
          npm install
          npm run build

      - name: Run Vulnerability Check
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

      - name: Run Go Tests
        run: go test ./...

      - name: Run Linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: goinstall

      - name: Build application
        run: wails3 build

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set Android Environment
        shell: bash
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -1)}"
          if [ -n "$NDK_PATH" ]; then
            echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
            echo "Using Android NDK: $NDK_PATH"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: |
          for i in 1 2 3; do
            go install -tags purego github.com/wailsapp/wails/v3/cmd/wails3@latest && break || sleep 3
          done

      - name: Build frontend
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          wails3 generate bindings -f '-tags purego' -clean=true -ts
          cd frontend
          npm install
          npm run build

      - name: Build Android APK
        run: wails3 task build:android
