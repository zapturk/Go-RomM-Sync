name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: android
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Setup Java (Android)
        if: matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set Android Environment
        if: matrix.target == 'android'
        shell: bash
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -1)}"
          if [ -n "$NDK_PATH" ]; then
            echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
            echo "Using Android NDK: $NDK_PATH"
          fi

      - name: Install NSIS (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsisPath) {
            echo $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Install Wails CLI
        shell: bash
        run: |
          for i in 1 2 3; do
            go install -tags purego github.com/wailsapp/wails/v3/cmd/wails3@latest && break || sleep 3
          done

      - name: Set Version
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          perl -pi -e "s/version: \".*?\"/version: \"$VERSION\"/" build/config.yml
          perl -pi -e "s/version: \".*?\"/version: \"$VERSION\"/" build/linux/nfpm/nfpm.yaml
          perl -pi -e "s/versionName \".*?\"/versionName \"$VERSION\"/" build/android/app/build.gradle
          perl -pi -e "s/\"(file|product)_version\": \".*?\"/\"\$1_version\": \"$VERSION\"/" build/windows/info.json 2>/dev/null || true
          perl -pi -e "s/\"(FileVersion|ProductVersion)\": \".*?\"/\"\$1\": \"$VERSION\"/" build/windows/info.json 2>/dev/null || true
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build frontend
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          if [ "${{ matrix.target }}" = "android" ]; then
            wails3 generate bindings -f '-tags android' -ts
          else
            wails3 generate bindings -f '-tags purego' -ts
          fi
          cd frontend
          npm install
          npm run build

      - name: Build and Package (Desktop)
        if: matrix.target != 'android'
        run: wails3 task package

      - name: Build and Package (Android)
        if: matrix.target == 'android'
        run: |
          wails3 task package:android
          cp bin/go-romm-sync.apk go-romm-sync-android.apk

      - name: Package artifacts (Linux)
        if: matrix.target == 'linux'
        run: |
          # Create standalone tar.gz
          tar -czvf go-romm-sync-linux-amd64.tar.gz -C bin go-romm-sync
          
          # Copy generated packages to root for artifact collection
          cp bin/*.AppImage bin/*.deb bin/*.rpm bin/*.pkg.tar.zst . 2>/dev/null || true
          
          # Arch Linux PKGBUILD
          cd build/linux/arch
          sed -i "s/pkgver=.*/pkgver=$VERSION/" PKGBUILD
          git archive --format=tar.gz --prefix=Go-RomM-Sync-$VERSION/ HEAD -o source-code.tar.gz
          SHA256=$(sha256sum source-code.tar.gz | cut -d ' ' -f 1)
          sed -i "s/sha256sums=.*/sha256sums=('$SHA256')/" PKGBUILD
          cp PKGBUILD ../../../go-romm-sync-arch-PKGBUILD
          rm source-code.tar.gz

      - name: Package artifacts (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path bin/go-romm-sync.exe -DestinationPath go-romm-sync-windows-amd64.zip
          $installer = Get-ChildItem -Path bin -Filter "*installer.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName -Destination "go-romm-sync-windows-installer.exe"
          }

      - name: Package artifacts (macOS)
        if: matrix.target == 'macos'
        run: |
          cd bin
          zip -r ../go-romm-sync-macos.zip go-romm-sync.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
            *.deb
            *.rpm
            *.pkg.tar.zst
            *.exe
            *.AppImage
            *.apk
            go-romm-sync-arch-PKGBUILD
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
