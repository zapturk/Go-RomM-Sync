name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: "linux/amd64"
            tags: "-tags webkit2_41"
          - os: windows-latest
            platform: "windows/amd64"
            tags: ""
          - os: macos-latest
            platform: "darwin/universal"
            tags: ""
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install -tags purego github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Set Version
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          perl -pi -e "s/version: \".*?\"/version: \"$VERSION\"/" build/config.yml

      - name: Build application
        run: wails3 task package

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          
          # Prepare binary for nfpm (needs to be in same dir as nfpm.yaml)
          mv bin/go-romm-sync build/linux/go-romm-sync
          
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          
          cd build/linux
          VERSION=$VERSION nfpm pkg --packager deb --target ../../
          VERSION=$VERSION nfpm pkg --packager rpm --target ../../
          VERSION=$VERSION nfpm pkg --packager archlinux --target ../../
          
          # Arch Linux PKGBUILD
          cd arch
          sed -i "s/pkgver=.*/pkgver=$VERSION/" PKGBUILD
          
          # Calculate SHA256 of the source archive
          # We create a reproducible archive using git archive
          git archive --format=tar.gz --prefix=Go-RomM-Sync-$VERSION/ HEAD -o source-code.tar.gz
          SHA256=$(sha256sum source-code.tar.gz | cut -d ' ' -f 1)
          sed -i "s/sha256sums=.*/sha256sums=('$SHA256')/" PKGBUILD
          
          cp PKGBUILD ../../../go-romm-sync-arch-PKGBUILD
          rm source-code.tar.gz
          
          # Maintain original tar.gz
          cd ../../../
          mv build/linux/go-romm-sync go-romm-sync-linux
          tar -czvf go-romm-sync-linux-amd64.tar.gz go-romm-sync-linux

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path bin/go-romm-sync.exe -DestinationPath go-romm-sync-windows-amd64.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd bin
          zip -r ../go-romm-sync-macos.zip go-romm-sync.app

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            *.zip
            *.deb
            *.rpm
            *.pkg.tar.zst
            go-romm-sync-arch-PKGBUILD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GOOS: android
      CGO_ENABLED: '0'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set Android Environment
        shell: bash
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -1)}"
          if [ -n "$NDK_PATH" ]; then
            echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
            echo "Using Android NDK: $NDK_PATH"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install -tags purego github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Set Version
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          perl -pi -e "s/version: \".*?\"/version: \"$VERSION\"/" build/config.yml
          perl -pi -e "s/versionName \".*?\"/versionName \"$VERSION\"/" build/android/app/build.gradle

      - name: Package Android APK
        run: |
          wails3 task package:android
          cp bin/go-romm-sync.apk go-romm-sync-android.apk

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            go-romm-sync-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
