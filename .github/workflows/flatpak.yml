name: Flatpak

on:
  push:
    branches: [ main, master, FlatHub ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  flatpak:
    name: Build Flatpak Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build application
        run: wails build -platform linux/amd64 -tags webkit2_41

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.zapturk.GoRomMSync.flatpak
          manifest-path: io.github.zapturk.GoRomMSync.yaml
          cache-key: flatpak-builder-${{ github.sha }}
          build-bundle: false
          upload-artifact: false
          run-tests: false

      - name: Export Flatpak Bundle
        run: |
          flatpak build-bundle repo io.github.zapturk.GoRomMSync.flatpak io.github.zapturk.GoRomMSync master

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: io.github.zapturk.GoRomMSync.flatpak
          path: io.github.zapturk.GoRomMSync.flatpak
          if-no-files-found: error
