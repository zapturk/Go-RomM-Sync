# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "go-romm-sync"
arch: "${GOARCH}"
platform: "linux"
version: "0.5.1"
section: "default"
priority: "extra"
maintainer: "Zapturk <scottmckeefer@gmail.com>"
description: "A seamless bridge between RomM and RetroArch for a console-like gaming experience."
vendor: "Zapturk"
homepage: "https://github.com/zapturk/Go-RomM-Sync"
license: "GPL-3.0-or-later"
release: "1"

contents:
  - src: "./bin/go-romm-sync"
    dst: "/usr/local/bin/go-romm-sync"
    file_info:
      mode: 0755
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/go-romm-sync.png"
  - src: "./build/linux/go-romm-sync.desktop"
    dst: "/usr/share/applications/go-romm-sync.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
