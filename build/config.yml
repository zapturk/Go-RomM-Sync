# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "Zapturk"
  productName: "Go RomM Sync"
  productIdentifier: "com.zapturk.gorommsync"
  description: "A seamless bridge between RomM and RetroArch for a console-like gaming experience."
  copyright: "Copyright © 2026 Zapturk"
  comments: "A seamless bridge between RomM and RetroArch for a console-like gaming experience."
  version: "0.2.2"

# iOS build configuration
# ios:
#   bundleID: "com.zapturk.gorommsync"
#   displayName: "Go RomM Sync"
#   version: "0.2.2"
#   company: "Zapturk"
#   comments: "A seamless bridge between RomM and RetroArch for a console-like gaming experience."

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
